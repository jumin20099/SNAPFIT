version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: snapfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapfit
      POSTGRES_PASSWORD: snapfit123
      POSTGRES_DB: snapfitdb
    ports:
      - '5432:5432'
    volumes:
      - snapfit_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: snapfit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  snapfit_pgdata:
  snapfit_redisdata:
