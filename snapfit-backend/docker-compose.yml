version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: snapfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapfit
      POSTGRES_PASSWORD: snapfit123
      POSTGRES_DB: snapfitdb
    ports:
      - '5432:5432'
    volumes:
      - snapfit_pgdata:/var/lib/postgresql/data

volumes:
  snapfit_pgdata:
