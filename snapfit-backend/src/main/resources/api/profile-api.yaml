openapi: 3.0.3
info:
  title: SnapFit Profile Management API
  description: 사용자 프로필 관리 API (프로필 사진, 닉네임 변경)
  version: 1.0.0

paths:
  /api/user/profile:
    patch:
      summary: 사용자 프로필 업데이트
      description: 닉네임과/또는 프로필 이미지 URL 업데이트
      tags:
        - Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 프로필 업데이트 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: 잘못된 요청 (닉네임 중복, 유효성 검사 실패)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
        '409':
          description: 닉네임 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/media/upload/profile:
    post:
      summary: 프로필 사진 업로드
      description: 프로필 사진을 S3에 업로드하고 URL 반환
      tags:
        - Media
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 이미지 파일 (JPG, PNG, WEBP, 최대 5MB)
              required:
                - file
      responses:
        '200':
          description: 파일 업로드 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '400':
          description: 잘못된 파일 형식 또는 크기 초과
        '401':
          description: 인증 실패

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProfileUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^[가-힣a-zA-Z0-9\s]+$'
          description: 새 닉네임 (2-20자, 한글/영문/숫자/공백)
          example: "새로운닉네임"
        profileImage:
          type: string
          format: uri
          description: 새 프로필 이미지 URL
          example: "https://snapfit-bucket.s3.amazonaws.com/profiles/uuid-file.jpg"
      minProperties: 1
      description: 닉네임과 프로필 이미지 중 최소 하나는 제공되어야 함

    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "프로필이 성공적으로 업데이트되었습니다"
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        userIdx:
          type: string
          format: uuid
          example: "87b18a9c-d2ba-4318-b9aa-859e03c5aad7"
        email:
          type: string
          format: email
          example: "user@example.com"
        nickname:
          type: string
          example: "사용자닉네임"
        profileImage:
          type: string
          format: uri
          nullable: true
          example: "https://snapfit-bucket.s3.amazonaws.com/profiles/uuid-file.jpg"
        role:
          type: string
          enum: [USER, PARTNER, ADMIN]
          example: "USER"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaUploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123
            url:
              type: string
              format: uri
              example: "https://snapfit-bucket.s3.amazonaws.com/profiles/uuid-file.jpg"
            mediaType:
              type: string
              example: "image/jpeg"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "닉네임이 이미 사용 중입니다"
        code:
          type: string
          example: "DUPLICATE_NICKNAME"
