openapi: 3.0.3
info:
  title: SnapFit Report & Block System API
  version: 1.0.0
  description: 신고 및 차단 시스템 API 계약

paths:
  # 차단 시스템
  /api/blocks/{userId}:
    post:
      tags: [Block System]
      summary: 사용자 차단
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 차단 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '400':
          description: 잘못된 요청 (자기 자신 차단 등)
        '401':
          description: 인증 필요
    delete:
      tags: [Block System]
      summary: 차단 해제
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 차단 해제 성공
        '401':
          description: 인증 필요
        '404':
          description: 차단 관계 없음

  /api/blocks/my:
    get:
      tags: [Block System]
      summary: 내 차단 목록 조회
      responses:
        '200':
          description: 차단 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockResponse'
        '401':
          description: 인증 필요

  /api/blocks/check/{userId}:
    get:
      tags: [Block System]  
      summary: 차단 상태 확인
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 차단 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  isBlocked:
                    type: boolean
        '401':
          description: 인증 필요

  # 신고 시스템
  /api/reports:
    post:
      tags: [Report System]
      summary: 신고 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: 신고 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: 잘못된 요청
        '401':
          description: 인증 필요
    get:
      tags: [Report System]
      summary: 내 신고 목록 조회
      responses:
        '200':
          description: 신고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportResponse'
        '401':
          description: 인증 필요

  /api/admin/reports:
    get:
      tags: [Admin Report System]
      summary: 관리자용 신고 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 신고 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPageResponse'
        '401':
          description: 인증 필요
        '403':
          description: 관리자 권한 필요

  /api/admin/reports/{reportId}/status:
    put:
      tags: [Admin Report System]
      summary: 신고 상태 변경
      security:
        - bearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportStatusRequest'
      responses:
        '200':
          description: 상태 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          description: 인증 필요
        '403':
          description: 관리자 권한 필요
        '404':
          description: 신고 없음

components:
  schemas:
    BlockResponse:
      type: object
      properties:
        blockedUserId:
          type: string
          format: uuid
        blockedUserNickname:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateReportRequest:
      type: object
      required:
        - category
        - reason
      properties:
        reportedUserId:
          type: string
          format: uuid
          description: 신고당하는 사용자 (사용자 신고 시)
        reportedPostId:
          type: integer
          format: int64
          description: 신고당하는 게시글 (게시글 신고 시)
        reportedCommentId:
          type: integer
          format: int64
          description: 신고당하는 댓글 (댓글 신고 시)
        category:
          $ref: '#/components/schemas/ReportCategory'
        reason:
          type: string
          maxLength: 1000

    ReportResponse:
      type: object
      properties:
        reportId:
          type: integer
          format: int64
        reporterNickname:
          type: string
        reportedUserId:
          type: string
          format: uuid
        reportedUserNickname:
          type: string
        reportedPostId:
          type: integer
          format: int64
        reportedCommentId:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/ReportCategory'
        reason:
          type: string
        status:
          $ref: '#/components/schemas/ReportStatus'
        adminNote:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateReportStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        adminNote:
          type: string
          maxLength: 1000

    ReportPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReportResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    ReportCategory:
      type: string
      enum:
        - SPAM
        - INAPPROPRIATE_CONTENT
        - HARASSMENT
        - OTHER

    ReportStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
